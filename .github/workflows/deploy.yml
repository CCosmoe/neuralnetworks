name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    # Deploys only from master, and only once the GCP repository variables are configured (see DEPLOY.md).
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for keyless auth via Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: spiral-api
          region: ${{ vars.GCP_REGION }}
          source: .
          flags: --allow-unauthenticated --memory=512Mi --max-instances=2

      - name: Smoke test
        run: |
          curl -sf "${{ steps.deploy.outputs.url }}/health"
          curl -sf -X POST "${{ steps.deploy.outputs.url }}/predict" \
            -H "Content-Type: application/json" \
            -d '{"points": [[0.3, -0.5]]}'
